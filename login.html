<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTrack - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F8F0DF 0%, #FFF8ED 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #FFF8ED;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(85, 107, 79, 0.1);
            padding: 3rem;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: #556B4F;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-control {
            border: 2px solid rgba(85, 107, 79, 0.15);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-family: 'Inter', sans-serif;
        }
        .form-control:focus {
            border-color: #556B4F;
            box-shadow: 0 0 0 3px rgba(85, 107, 79, 0.1);
        }
        .btn-primary {
            background: #556B4F;
            border: none;
            border-radius: 12px;
            padding: 0.75rem;
            width: 100%;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #4a5d45;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(85, 107, 79, 0.3);
        }
        .leaf-icon {
            color: #7DA86F;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fas fa-leaf leaf-icon me-2"></i>ZenTrack
        </div>
        <h4 class="text-center mb-4" style="color: #556B4F;">Welcome Back</h4>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label" style="color: #556B4F;">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" style="color: #556B4F;">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Demo credentials: student / demo123</small>
        </div>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if ((username === 'student' && password === 'student123') || 
                (username === 'guidance' && password === 'guidance123') ||
                (username === 'admin' && password === 'admin123')) {
                window.location.href = 'index.html';
            } else {
                alert('Invalid credentials! Try: student / student123');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
